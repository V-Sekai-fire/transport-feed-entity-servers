# Unit checks and a live check of the fdb: open path against a real FoundationDB.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fdb-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FDB_VERSION: "7.3.76"
      WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo -S -p '' apt-get install -y --no-install-recommends liburing-dev sqlite3 curl unzip gdb
      - name: Install FoundationDB
        run: |
          for p in clients server; do
            curl -fsSL -o /tmp/$p.deb "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-${p}_${FDB_VERSION}-1_amd64.deb"
          done
          sudo -S -p '' dpkg -i /tmp/clients.deb /tmp/server.deb
          ok=0
          for i in $(seq 1 30); do
            if fdbcli --exec 'status minimal' | grep -q 'The database is available'; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "FoundationDB never became available"; exit 1; }
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned SQLite
        run: bash deploy/scripts/fetch-sqlite.sh
      - name: Build
        run: lake build feed-tests sqlite-check
      - name: Unit tests
        run: lake exe feed-tests
      - name: Cluster-free fdb open checks
        run: bash deploy/scripts/fdb-open-check.sh
      - name: Live fdb check
        run: bash deploy/scripts/fdb-live-check.sh "ci-${GITHUB_RUN_ID}"
      - name: Backtrace of the crash
        if: failure()
        run: |
          gdb -batch -ex run -ex bt -ex "info sharedlibrary" --args .lake/build/bin/sqlite-check "fdb:ci-bt-${GITHUB_RUN_ID}" 2>&1 | tail -40
  entity-tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build the tick object under strict C99
        run: |
          cd transports/csrc
          gcc -std=c99 -Wall -Wextra -Werror -pedantic -O2 -c entity_tick.c -o /tmp/entity_tick.o
          gcc -std=gnu99 -Wall -Wextra -Werror -O2 entity_check.c /tmp/entity_tick.o -lpthread -o /tmp/entity_check
      - name: The tick object has no allocator or Lean runtime symbols
        run: |
          if nm /tmp/entity_tick.o | grep -E ' U (malloc|free|lean_)'; then exit 1; fi
      - name: Loopback check passes inside the 4 ms budget
        run: /tmp/entity_check
      - name: Planted slow handler must fail the budget
        run: |
          if ENTITY_SLOW_NS=6000000 /tmp/entity_check > /tmp/slow.out; then cat /tmp/slow.out; exit 1; fi
          cat /tmp/slow.out
          grep -q 'FAIL: p99 over the 4 ms budget' /tmp/slow.out
  tick-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Runner conditions
        run: |
          uname -r
          nproc
          lscpu -e
          grep -H . /sys/devices/system/cpu/cpu*/topology/thread_siblings_list
          if [ "$(nproc)" != 4 ]; then echo "expected 4 vCPUs, got $(nproc)"; exit 1; fi
      - name: Build the loopback check
        run: cc -std=gnu99 -O2 -Wall -Wextra -Werror -pthread transports/csrc/entity_check.c transports/csrc/entity_tick.c -o "$RUNNER_TEMP/entity_check"
      - name: Planted 6 ms handler must fail the 4 ms budget
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if ENTITY_SLOW_NS=6000000 "$RUNNER_TEMP/entity_check"; then echo "run $i: planted defect not caught"; exit 1; fi
          done
      - name: Clean run stays inside the budget
        run: |
          for i in 1 2 3 4 5 6 7 8; do "$RUNNER_TEMP/entity_check" || exit 1; done
      - name: Build the server and the loader
        run: |
          cc -std=gnu99 -O2 -Wall -Wextra -Werror transports/csrc/entity_serve.c transports/csrc/entity_tick.c -o "$RUNNER_TEMP/entity_serve"
          cc -std=gnu99 -O2 -Wall -Wextra -Werror transports/csrc/entity_load.c -o "$RUNNER_TEMP/entity_load"
      - name: Two pinned layouts, planted defect on server B only
        run: BIN="$RUNNER_TEMP" bash deploy/scripts/tick-layouts.sh
